<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gig Board Clone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <h1>GigBoard</h1>
      <button class="btn">Post a Gig</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Find work that fits your schedule</h2>
      <p>Browse local gigs, remote opportunities, and short-term projects.</p>
      <div class="filters">
        <input id="searchInput" type="text" placeholder="Search gigs, skills, company..." />
        <select id="typeFilter">
          <option value="all">All types</option>
          <option value="remote">Remote</option>
          <option value="onsite">On-site</option>
        </select>
      </div>
    </section>

    <section>
      <h3>Latest gigs</h3>
      <div id="gigList" class="grid"></div>
    </section>
  </main>

  <template id="gigCardTemplate">
    <article class="card">
      <div class="card-top">
        <h4 class="title"></h4>
        <span class="pill type"></span>
      </div>
      <p class="meta"></p>
      <p class="description"></p>
      <div class="footer">
        <strong class="pay"></strong>
        <button class="btn secondary">Apply</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
