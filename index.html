<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gig Board Clone</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <h1>GigBoard</h1>
      <button id="openPostModal" class="btn">Post a Gig</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Find work that fits your schedule</h2>
      <p>Browse local gigs, remote opportunities, and short-term projects.</p>
      <div class="filters">
        <input id="searchInput" type="text" placeholder="Search gigs, skills, company..." />
        <select id="typeFilter">
          <option value="all">All types</option>
          <option value="remote">Remote</option>
          <option value="onsite">On-site</option>
        </select>
      </div>
    </section>

    <section>
      <h3>Latest gigs</h3>
      <div id="gigList" class="grid"></div>
    </section>
  </main>

  <dialog id="postGigDialog">
    <form id="postGigForm" class="post-form">
      <h3>Post a new gig</h3>
      <input name="title" placeholder="Title" required />
      <input name="company" placeholder="Company" required />
      <input name="location" placeholder="Location" required />
      <select name="type" required>
        <option value="remote">Remote</option>
        <option value="onsite">On-site</option>
      </select>
      <input name="pay" placeholder="Pay (ex: $35/hr)" required />
      <textarea name="description" placeholder="Description" required></textarea>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" id="cancelPost" class="btn secondary">Cancel</button>
        <button type="submit" class="btn">Publish gig</button>
      </div>
    </form>
  </dialog>

  <template id="gigCardTemplate">
    <article class="card">
      <div class="card-top">
        <h4 class="title"></h4>
        <span class="pill type"></span>
      </div>
      <p class="meta"></p>
      <p class="description"></p>
      <p class="applications"></p>
      <div class="footer">
        <strong class="pay"></strong>
        <button class="btn secondary apply-btn">Apply</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
